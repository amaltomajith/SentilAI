[project]
name = "sentinel"
version = "2.0.0"
description = "Sentinel v2 - autonomous honeypot, active-defense MCP platform, syndicate attribution"
requires-python = ">=3.11"
dependencies = [
  "fastapi", "uvicorn[standard]", "sqlalchemy>=2", "pydantic", "httpx", "mcp>=2",
  "pyjwt[crypto]", "alembic", "networkx", "pillow", "edge-tts", "stix2", "fpdf2", "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
prod = ["psycopg[binary]"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["sentinel*"]


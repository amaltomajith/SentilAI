name: ci
on: [push, pull_request]

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No secrets / session credentials tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)|wa_session|creds\.json|\.sqlite3?$|\.db$' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "Tracked sensitive files:"; echo "$bad"; exit 1; fi
          if git grep -nE '(gsk_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}.{0,3}(SAMBANOVA|sambanova))' -- . ':!*.lock' ':!package-lock.json'; then exit 1; fi

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "backend[dev]"
      - name: pytest (offline, fixtures only, no keys, no network)
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npx eslint src --quiet
      - run: npx vitest run
      - run: npx vite build

  bridge:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: whatsapp-bridge } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: whatsapp-bridge/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: smoke, POSTGRES_DB: sentinel }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "backend[dev,prod]"
      - name: migrations and API smoke test on real Postgres
        working-directory: backend
        env: { DATABASE_URL: "postgresql://postgres:smoke@localhost:5432/sentinel" }
        run: python -m scripts.pg_smoke

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the combined image
        run: docker build -t sentinel:ci .
      - name: boots and answers /api/health
        run: |
          docker run -d --name s -p 8000:8000 -e BRIDGE_SHARED_SECRET=$(python3 -c "import secrets;print(secrets.token_hex(32))") sentinel:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/api/health && exit 0; sleep 1; done
          docker logs s; exit 1
